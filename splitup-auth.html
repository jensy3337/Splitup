<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplitUp – Group Project Coordinator</title>
<style>
:root{--bg0:#1e1f22;--bg1:#2b2d31;--bg2:#313338;--bg3:#383a40;--tx:#dbdee1;--mut:#949ba4;--acc:#5865f2;--ok:#23a55a;--warn:#f0b232;--bad:#f23f42;--line:#3f4147;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg0:#e3e5e8;--bg1:#f2f3f5;--bg2:#fff;--bg3:#ebedef;--tx:#2e3338;--mut:#5c6370;--line:#d4d7dc}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--tx);font:15px/1.45 'Segoe UI',system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:72px 232px 1fr;height:100%}
.rail{background:var(--bg0);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto}
.rail button{width:48px;height:48px;border:0;border-radius:24px;background:var(--bg2);font-weight:700;transition:border-radius .15s,background .15s;overflow:hidden;padding:0}
.rail button:hover,.rail button.on{border-radius:16px;background:var(--acc);color:#fff}
.rail .me{margin-top:auto}
.rail img{width:100%;height:100%;object-fit:cover;display:block}
.side{background:var(--bg1);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.side h2{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.ch{display:block;width:calc(100% - 16px);margin:2px 8px;padding:7px 10px;border:0;border-radius:6px;background:none;text-align:left;color:var(--mut)}
.ch:hover{background:var(--bg3);color:var(--tx)}
.ch.on{background:var(--bg3);color:var(--tx);font-weight:600}
.lbl{padding:14px 16px 4px;color:var(--mut);font-size:12px;font-weight:600}
.mem{display:flex;align-items:center;gap:8px;padding:5px 16px}
.mem small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:28px}
.code{margin:auto 12px 12px;padding:10px;border-radius:8px;background:var(--bg3);font-size:13px;color:var(--mut)}
.code b{color:var(--tx);letter-spacing:.5px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding:10px 20px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px;min-height:52px}
.top span{color:var(--mut);font-weight:400;font-size:13px}
.top .btn{margin-left:auto;padding:6px 12px;font-size:13px;white-space:nowrap}
.body{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
.msg{display:flex;gap:12px;margin:0 0 14px}
.msg b{margin-right:8px}
.msg small{color:var(--mut)}
.msg p{margin:2px 0 0;overflow-wrap:anywhere}
.bot{background:var(--acc);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:8px;vertical-align:1px}
.composer{padding:0 20px 16px;display:flex;gap:8px}
input,select{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.composer input{flex:1}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.hint{color:var(--mut);font-size:13px;padding:0 20px 14px;margin-top:-8px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--bg1);border-radius:10px;padding:12px;min-height:120px}
.col h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--bg3);border-radius:8px;padding:10px;margin-bottom:10px;border-left:4px solid var(--acc)}
.card p{margin:0 0 8px;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--mut);font-size:12px;flex-wrap:wrap}
.chip{padding:2px 8px;border-radius:10px;color:#fff;font-size:12px}
.mv{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;margin-top:8px}
.mv:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.add input[type=text]{flex:1;min-width:160px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:14px;border-radius:7px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .4s}
.alert{background:var(--bg1);border-left:4px solid var(--warn);border-radius:8px;padding:12px 14px;margin:16px 0}
.big{font-size:44px;font-weight:800;margin:0}
.stars button{border:0;background:none;font-size:22px;color:var(--mut);padding:0 2px}
.stars button.f{color:var(--warn)}
.panel{background:var(--bg1);border-radius:10px;padding:16px;margin-bottom:14px;max-width:560px}
.panel label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.panel input,.panel select{width:100%}
.err{color:var(--bad);margin:10px 0 0}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bad);color:#fff}
.who{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.who small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg0);color:var(--tx);padding:10px 16px;border-radius:8px;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media (max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
.rail{flex-direction:row;padding:8px 10px;overflow-x:auto;overflow-y:hidden}
.rail button{flex:none;width:42px;height:42px}
.rail .me{margin-top:0;margin-left:auto}
.side{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}
.side h2,.lbl,.mem,.code{display:none}
.ch{width:auto;margin:6px 3px;white-space:nowrap}
.board{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Teams"></nav>
  <aside class="side" id="side"></aside>
  <main><div class="top" id="top"></div><div class="body" id="body"></div><div id="foot"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Paste the same Firebase config you used before (copy it from your old index.html) */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCkjTtq8EKmNvNKrGGxJMCfkaTJL3Udnys",
  authDomain: "splitup-63c10.firebaseapp.com",
  projectId: "splitup-63c10",
  storageBucket: "splitup-63c10.firebasestorage.app",
  messagingSenderId: "499990923460",
  appId: "1:499990923460:web:abd9b0e19f622f82642191"
};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#5865f2','#3ba55d','#eb459e','#e67e22','#00a8d6','#9b59b6'];
const CH=[['chat','# team-chat'],['tasks','# task-board'],['contrib','# contributions'],['deadline','# deadlines'],['feedback','# peer-feedback']];
const SKILLS=['Coding','Design','Writing','Research','Presenting','Testing'];
const COLL='teamsV2';
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmt=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

const configured=!FIREBASE_CONFIG.apiKey.startsWith('PASTE');
let db=null,auth=null;
if(configured&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();auth=firebase.auth()}

let L={a:'',ch:'chat'};
try{Object.assign(L,JSON.parse(localStorage.getItem('splitup-local2')||'{}'))}catch(e){}
const saveL=()=>{try{localStorage.setItem('splitup-local2',JSON.stringify(L))}catch(e){}};
const teams={},unsubs={};
let me=null,authReady=false,newMsg='',signErr='',lastView='';

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2500)}
function watch(code){
  if(unsubs[code]||!db)return;
  unsubs[code]=db.collection(COLL).doc(code).onSnapshot(
    s=>{teams[code]=s.exists?s.data():null;render()},
    ()=>toast('Connection problem. Check your Firebase rules and internet.'));
}
function unwatchAll(){Object.values(unsubs).forEach(f=>f());for(const k in unsubs)delete unsubs[k];for(const k in teams)delete teams[k]}

/* Safe read-modify-write so two people editing at once don't overwrite each other */
function tm(code,fn){
  const ref=db.collection(COLL).doc(code);
  return db.runTransaction(async tx=>{
    const s=await tx.get(ref);if(!s.exists)throw new Error('missing');
    const d=s.data();fn(d);tx.set(ref,d);
  }).catch(()=>toast('Could not save. Check your internet and try again.'));
}
function addMsg(d,uid,name,x,bot){d.msgs.push({uid,w:name,x,ts:Date.now(),bot:!!bot});if(d.msgs.length>200)d.msgs.splice(0,d.msgs.length-200)}
const botMsg=(d,x)=>addMsg(d,'bot','Taskbot',x,1);
const meObj=()=>({uid:me.uid,name:me.name,skill:me.skill||'',photo:me.photo||''});

const T=()=>teams[L.a];
const mem=(d,uid)=>d.members.find(m=>m.uid===uid);
const nm=(d,uid)=>(mem(d,uid)||{}).name||'Former member';
const colorOf=(d,uid)=>COL[Math.max(0,d.members.findIndex(m=>m.uid===uid))%COL.length];
function avm(m,color,cls){
  return m&&m.photo?`<div class="av ${cls||''}" style="background:${color}"><img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer"></div>`:`<div class="av ${cls||''}" style="background:${color}">${esc(((m&&m.name)||'?')[0]).toUpperCase()}</div>`;
}
function av(d,uid,bot){
  if(bot)return `<div class="av" style="background:var(--acc)">T</div>`;
  return avm(mem(d,uid)||{name:'?'},colorOf(d,uid));
}
function go(c){L.ch=c;saveL();render()}
function pick(code){L.a=code;if(['new','profile'].includes(L.ch))L.ch='chat';saveL();render()}
window.go=go;window.pick=pick;

function setBody(html){
  const b=$('#body'),ae=document.activeElement;
  const id=ae&&ae.id&&b.contains(ae)?ae.id:null,vals={};
  b.querySelectorAll('[data-k]').forEach(e=>{if(e.id)vals[e.id]=e.value});
  const atEnd=b.scrollHeight-b.scrollTop-b.clientHeight<40,st=b.scrollTop;
  b.innerHTML=html;
  for(const k in vals){const e=document.getElementById(k);if(e)e.value=vals[k]}
  if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
  b.scrollTop=st;return atEnd;
}
function head(a,b,showCopy){
  $('#top').innerHTML=`${a}<span>${b}</span>`+(showCopy?`<button class="btn ghost" onclick="copyInvite()">Copy invite link</button>`:'');
}
window.copyInvite=()=>{
  const link=location.href.split('?')[0].split('#')[0]+'?join='+L.a;
  const done=()=>toast('Invite link copied. Send it to your teammates.');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(done,()=>toast(link));else toast(link);
};

/* ---------- Sign-in ---------- */
if(auth){
  auth.onAuthStateChanged(async u=>{
    if(!u){me=null;unwatchAll();authReady=true;render();return}
    try{
      const ref=db.collection('users').doc(u.uid),s=await ref.get();
      let p=s.exists?s.data():null;
      if(!p){p={name:u.displayName||'Student',skill:'',codes:[]};await ref.set(p)}
      me={uid:u.uid,email:u.email||'',photo:u.photoURL||'',name:p.name,skill:p.skill||'',codes:p.codes||[]};
      me.codes.forEach(watch);
      if(!me.codes.includes(L.a))L.a=me.codes[0]||'';
      signErr='';authReady=true;render();
    }catch(e){signErr='Signed in, but your profile could not load. Check your Firestore rules.';authReady=true;render()}
  });
}
window.signIn=()=>{
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e=>{
    if(e.code==='auth/popup-blocked')auth.signInWithRedirect(p);
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){signErr='Sign-in failed ('+e.code+'). Check that Google sign-in is enabled and this site is an authorised domain in Firebase.';render()}
  });
};
window.signOut=()=>{auth.signOut();L.a='';saveL()};

function render(){
  if(!db){setup();return}
  if(!authReady){$('#side').innerHTML='<h2>SplitUp</h2>';$('#rail').innerHTML='';head('SplitUp','Loading…');setBody('<p>Loading…</p>');$('#foot').innerHTML='';return}
  if(!me){signin();return}
  const view=(!me.codes.length&&L.ch!=='profile')?'new':L.ch;
  $('#rail').innerHTML=me.codes.map(c=>{const t=teams[c];const n=t?t.name:'…';return `<button class="${c===L.a&&!['new','profile'].includes(view)?'on':''}" onclick="pick('${c}')" title="${esc(n)}">${esc(n.split(' ').map(w=>w[0]).join('').slice(0,3))}</button>`}).join('')+
   `<button class="${view==='new'?'on':''}" onclick="go('new')" title="Create or join a team" aria-label="Create or join a team">+</button>`+
   `<button class="me ${view==='profile'?'on':''}" onclick="go('profile')" title="Your profile" aria-label="Your profile">${me.photo?`<img src="${esc(me.photo)}" alt="" referrerpolicy="no-referrer">`:esc((me.name[0]||'?').toUpperCase())}</button>`;
  if(view==='profile'||view==='new'){
    $('#side').innerHTML='<h2>SplitUp</h2>';$('#foot').innerHTML='';
    (view==='profile'?profile:newTeam)();lastView=view;return;
  }
  const t=T();
  if(!t){$('#side').innerHTML='<h2>SplitUp</h2>';$('#foot').innerHTML='';head('Loading team','Connecting…');setBody('<p>Loading your team…</p>');return}
  $('#side').innerHTML=`<h2>${esc(t.name)}<br><small style="color:var(--mut);font-weight:400">SplitUp</small></h2>`+CH.map(([k,l])=>`<button class="ch ${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+
   `<div class="lbl">Members – ${t.members.length}</div>`+t.members.map(m=>`<div class="mem">${av(t,m.uid)}<div>${esc(m.name)}${m.uid===me.uid?' (you)':''}${m.skill?`<small>${esc(m.skill)}</small>`:''}</div></div>`).join('')+
   `<div class="code">Invite code<br><b>${esc(t.code)}</b></div>`;
  if(view!=='chat')$('#foot').innerHTML='';
  ({chat,tasks,contrib,deadline,feedback}[view]||chat)(t);
  lastView=view;
}

function setup(){
  head('Set up Firebase','One-time step');
  $('#side').innerHTML='<h2>SplitUp</h2>';
  $('#body').innerHTML=`<div class="panel"><h3 style="margin-top:0">Firebase is not connected yet</h3><p>Open this file in VS Code, find <b>FIREBASE_CONFIG</b> near the top of the script, and paste your own Firebase values there. Then save and refresh this page.</p></div>`;
}
function signin(){
  $('#rail').innerHTML='';$('#side').innerHTML='<h2>SplitUp</h2>';$('#foot').innerHTML='';
  head('Welcome to SplitUp','Sign in to join your team');
  setBody(`<div class="panel"><h3 style="margin-top:0">Sign in</h3><p style="color:var(--mut)">Use your Google account so teammates see your real name and photo, and your teams follow you to any device.</p><button class="btn" onclick="signIn()">Sign in with Google</button><p class="err" role="alert">${esc(signErr)}</p></div>`);
}

function profile(){
  head('Your profile','Visible to your teammates');
  setBody(`<div class="panel"><div class="who">${avm(me,COL[0],'lg')}<div><b>${esc(me.name)}</b><br><small>${esc(me.email)}</small></div></div>
  <label for="pn">Display name</label><input id="pn" data-k value="${esc(me.name)}" maxlength="24">
  <label for="ps">Your strength</label><select id="ps" data-k><option value="">Not set</option>${SKILLS.map(s=>`<option ${s===me.skill?'selected':''}>${s}</option>`).join('')}</select>
  <br><br><button class="btn" onclick="saveProfile()">Save profile</button> <button class="btn ghost" onclick="signOut()">Sign out</button></div>
  <p style="color:var(--mut);max-width:560px">Your name and strength appear in the member list of every team you’re in. Use your strength when splitting tasks.</p>`);
}
window.saveProfile=()=>{
  const n=$('#pn').value.trim().replace(/\s+/g,' ');
  if(!n){toast('Enter a display name.');$('#pn').focus();return}
  const s=$('#ps').value;
  me.name=n;me.skill=s;
  db.collection('users').doc(me.uid).set({name:n,skill:s},{merge:true}).catch(()=>toast('Could not save profile.'));
  me.codes.forEach(c=>tm(c,d=>{const m=mem(d,me.uid);if(m){m.name=n;m.skill=s}}));
  toast('Profile saved');render();
};

function chat(t){
  head('# team-chat','Talk, and add work with /task',true);
  const atEnd=setBody(t.msgs.map(m=>{const who=m.bot?'Taskbot':(mem(t,m.uid)?mem(t,m.uid).name:(m.w||'Former member'));return `<div class="msg">${av(t,m.uid,m.bot)}<div><b>${esc(who)}</b>${m.bot?'<span class="bot">BOT</span>':''}<small>${fmt(m.ts)}</small><p>${esc(m.x)}</p></div></div>`}).join('')||'<p style="color:var(--mut)">No messages yet. Say hi to your team.</p>');
  if(atEnd||lastView!=='chat'){const b=$('#body');b.scrollTop=b.scrollHeight}
  if(!$('#mi')){
    $('#foot').innerHTML=`<div class="composer"><input id="mi" placeholder="Message # team-chat" aria-label="Message"><button class="btn" id="ms">Send</button></div><div class="hint">Try: /task Design poster @Aisha</div>`;
    const send=()=>{
      const i=$('#mi'),v=i.value.trim();if(!v)return;i.value='';
      tm(L.a,d=>{
        if(v.startsWith('/task ')){
          const mt=v.match(/@(\S+)\s*$/);
          const target=(mt&&d.members.find(m=>m.name.split(' ')[0].toLowerCase()===mt[1].toLowerCase()))||mem(d,me.uid)||d.members[0];
          const title=v.slice(6).replace(/@\S+\s*$/,'').trim()||'Untitled task';
          d.nid=(d.nid||0)+1;d.tasks.push({id:d.nid,t:title,who:target.uid,st:0,due:day(7)});
          addMsg(d,me.uid,me.name,v);botMsg(d,`Added “${title}” for ${target.name}, due in 7 days.`);
        }else addMsg(d,me.uid,me.name,v);
      });
    };
    $('#ms').onclick=send;$('#mi').onkeydown=e=>{if(e.key==='Enter')send()};
  }
}

const ST=['To do','In progress','Done'];
function tasks(t){
  head('# task-board','Move a task forward with its button',true);
  const cols=[0,1,2].map(s=>{
    const list=t.tasks.filter(x=>x.st===s);
    return `<div class="col"><h3>${ST[s]}<span>${list.length}</span></h3>`+list.map(x=>`<div class="card" style="border-color:${colorOf(t,x.who)}"><p>${esc(x.t)}</p><div class="meta"><span class="chip" style="background:${colorOf(t,x.who)}">${esc(nm(t,x.who))}</span><span>Due ${esc(x.due)}</span></div>${s<2?`<button class="mv" onclick="mv(${x.id})">Move to ${ST[s+1]}</button>`:''}</div>`).join('')+(list.length?'':'<small style="color:var(--mut)">Nothing here yet.</small>')+`</div>`}).join('');
  setBody(`<div class="add"><input type="text" id="nt" data-k placeholder="New task title" aria-label="Task title"><select id="nw" data-k aria-label="Assign to">${t.members.map(m=>`<option value="${esc(m.uid)}" ${m.uid===me.uid?'selected':''}>${esc(m.name)}${m.skill?' ('+esc(m.skill)+')':''}</option>`).join('')}</select><input type="date" id="nd" data-k value="${day(7)}" aria-label="Due date"><button class="btn" onclick="addT()">Add task</button></div><div class="board">${cols}</div>`);
}
window.mv=id=>tm(L.a,d=>{const x=d.tasks.find(k=>k.id===id);if(!x||x.st>1)return;x.st++;if(x.st===2)botMsg(d,`${nm(d,x.who)} finished “${x.t}”. Nice work!`)});
window.addT=()=>{
  const v=$('#nt').value.trim();if(!v){$('#nt').focus();return}
  const who=$('#nw').value,due=$('#nd').value||day(7);$('#nt').value='';
  tm(L.a,d=>{d.nid=(d.nid||0)+1;d.tasks.push({id:d.nid,t:v,who,st:0,due});botMsg(d,`New task “${v}” assigned to ${nm(d,who)}.`)});
};

function contrib(t){
  head('# contributions','Who has finished what',true);
  const done=t.tasks.filter(x=>x.st===2),tot=done.length;
  const rows=t.members.map(m=>({m,d:done.filter(x=>x.who===m.uid).length,a:t.tasks.filter(x=>x.who===m.uid).length}));
  let h=rows.map(r=>{const p=tot?Math.round(r.d/tot*100):0;return `<div class="row">${av(t,r.m.uid)}<div style="width:80px;overflow-wrap:anywhere">${esc(r.m.name)}</div><div class="bar"><i style="width:${p}%;background:${colorOf(t,r.m.uid)}"></i></div><div style="width:130px;text-align:right">${p}% <small style="color:var(--mut)">(${r.d} of ${r.a} tasks)</small></div></div>`}).join('');
  const fair=100/t.members.length,top=rows.slice().sort((a,b)=>b.d-a.d)[0];
  if(tot>=3&&t.members.length>1&&top.d/tot*100>fair+20)h+=`<div class="alert"><b>Uneven workload:</b> ${esc(top.m.name)} has finished ${Math.round(top.d/tot*100)}% of completed tasks. A fair share here is about ${Math.round(fair)}%. Consider moving open tasks to others.</div>`;
  rows.filter(r=>r.d===0&&r.a>0).forEach(r=>h+=`<div class="alert"><b>${esc(r.m.name)}</b> has ${r.a} task(s) assigned and none finished yet.</div>`);
  setBody(`<p class="big">${tot}<small style="font-size:16px;font-weight:400;color:var(--mut)"> of ${t.tasks.length} tasks done</small></p><br>`+h);
}

function deadline(t){
  head('# deadlines','Submission countdown and overdue work',true);
  const d=Math.ceil((new Date(t.deadline+'T23:59:59')-new Date())/864e5);
  const open=t.tasks.filter(x=>x.st<2).sort((a,b)=>a.due.localeCompare(b.due));
  setBody(`<p class="big" style="color:${d<0?'var(--bad)':d<4?'var(--warn)':'var(--ok)'}">${d<0?Math.abs(d)+' days late':d+' days left'}</p><label>Submission date <input type="date" id="dd" value="${esc(t.deadline)}" style="margin-left:8px"></label><h3 style="margin-top:24px">Open tasks</h3>`+
   (open.map(x=>{const late=x.due<day(0);return `<div class="row">${av(t,x.who)}<div style="flex:1">${esc(x.t)}<br><small style="color:var(--mut)">${esc(nm(t,x.who))} · due ${esc(x.due)}</small></div>${late?'<span class="tag">Overdue</span>':''}</div>`}).join('')||'<p>All tasks are done. Time to submit.</p>'));
  $('#dd').onchange=e=>{const v=e.target.value;if(v)tm(L.a,x=>{x.deadline=v})};
}

function feedback(t){
  head('# peer-feedback','Private rating: did everyone contribute?',true);
  const others=t.members.filter(m=>m.uid!==me.uid),mine=(t.fb&&t.fb[me.uid])||{};
  const avg=uid=>{const v=Object.values(t.fb||{}).map(r=>r[uid]).filter(Boolean);return v.length?{a:v.reduce((x,y)=>x+y,0)/v.length,n:v.length}:null};
  const any=t.members.some(m=>avg(m.uid));
  setBody(`<p style="color:var(--mut);max-width:560px">Rate each teammate’s contribution from 1 to 5. Individual ratings stay private and the teacher sees only the averages.</p>`+
   (others.map((m,i)=>{const r=mine[m.uid]||0;return `<div class="row">${av(t,m.uid)}<div style="width:90px;overflow-wrap:anywhere">${esc(m.name)}</div><div class="stars" role="group" aria-label="Rate ${esc(m.name)}">${[1,2,3,4,5].map(n=>`<button class="${n<=r?'f':''}" onclick="rate(${i},${n})" aria-label="${n} stars">★</button>`).join('')}</div></div>`}).join('')||'<p>No teammates have joined yet. Share the invite link.</p>')+
   (any?`<div class="alert" style="border-color:var(--ok)"><b>Teacher view:</b> ${t.members.map(m=>{const x=avg(m.uid);return `${esc(m.name)} ${x?x.a.toFixed(1)+' ('+x.n+')':'–'}`}).join(' · ')}</div>`:''));
}
window.rate=(i,n)=>{const t=T(),m=t.members.filter(x=>x.uid!==me.uid)[i];if(!m)return;tm(L.a,d=>{d.fb=d.fb||{};d.fb[me.uid]=d.fb[me.uid]||{};d.fb[me.uid][m.uid]=n})};

function addCode(code){
  if(!me.codes.includes(code))me.codes.push(code);
  L.a=code;L.ch='chat';newMsg='';saveL();watch(code);
  db.collection('users').doc(me.uid).set({codes:firebase.firestore.FieldValue.arrayUnion(code)},{merge:true}).catch(()=>{});
  render();
}
function newTeam(){
  head('Create or join a team','Signed in as '+esc(me.name));
  const pre=new URLSearchParams(location.search).get('join')||'';
  setBody(`<div class="panel"><h3 style="margin-top:0">Create a team</h3><label for="tn">Project name</label><input id="tn" data-k placeholder="e.g. Physics Lab Report" maxlength="40"><br><br><button class="btn" id="tc">Create team</button></div>
  <div class="panel"><h3 style="margin-top:0">Join with a code</h3><label for="jc">Invite code</label><input id="jc" data-k placeholder="e.g. DBMS-482" value="${esc(pre)}"><br><br><button class="btn ghost" id="jb">Join team</button></div>
  <p class="err" id="em" role="alert">${esc(newMsg)}</p>`);
  $('#tc').onclick=async()=>{
    const p=$('#tn').value.trim();if(!p){$('#em').textContent='Enter a project name.';$('#tn').focus();return}
    const code=(p.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||'TEAM')+'-'+Math.floor(100+Math.random()*900);
    const d={name:p,code,deadline:day(10),members:[meObj()],tasks:[],msgs:[],fb:{},nid:0};
    botMsg(d,`Team created by ${me.name}. Share code ${code} with your teammates.`);
    try{await db.collection(COLL).doc(code).set(d);addCode(code)}
    catch(e){$('#em').textContent='Could not create the team. Check your Firebase config and Firestore rules.'}
  };
  $('#jb').onclick=async()=>{
    const code=$('#jc').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
    if(!code){$('#em').textContent='Enter an invite code.';$('#jc').focus();return}
    try{
      await db.runTransaction(async tx=>{
        const ref=db.collection(COLL).doc(code),s=await tx.get(ref);
        if(!s.exists)throw new Error('missing');
        const d=s.data();
        if(!mem(d,me.uid)){d.members.push(meObj());botMsg(d,`${me.name} joined the team.`);tx.set(ref,d)}
      });
      addCode(code);
    }catch(e){$('#em').textContent='No team found with that code. Check the code and try again.'}
  };
}
render();
</script>
</body>
</html>
